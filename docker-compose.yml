# ─────────────────────────────────────────────────────────────────────────────
# PetOLife — docker-compose.yml
#
# Usage:
#   Local testing:          docker compose up -d --build
#   Production (server):    ENVIRONMENT=production docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  certbot_www:       # ACME HTTP-01 challenge files
  certbot_conf:      # SSL certs + Let's Encrypt account
  nginx_logs:        # Persistent Nginx logs

networks:
  petolife_internal:
    driver: bridge
  petolife_external:
    driver: bridge

services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    image: petolife-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
    networks:
      - petolife_internal
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    # SECURITY: Prevent privilege escalation, enforce read-only filesystem
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # LOGGING: CloudWatch compatible JSON format
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx + React SPA ─────────────────────────────────────────────────────
  nginx:
    image: petolife-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
        VITE_SUPABASE_URL: "${SUPABASE_URL}"
        VITE_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx-local.conf}:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - petolife_internal
      - petolife_external
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (Let's Encrypt SSL) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    restart: unless-stopped
    networks:
      - petolife_external
